name: ERCW watchdog

# 雲端 routine 每週日 10:00（台北）跑。
# ①週日 14:00 檢查本週週報有沒有上線；沒上線也沒有開著的 PR（＝routine 整個沒產出）→ 轉紅。
# ②每天 09:00 檢查有沒有開超過 24 小時還沒合併的週報 PR（查核沒過、等 Bear）→ 轉紅。
# 2026-11-02 起不推 LINE：紅燈＋::error::，Grok Bot 每小時讀 annotation 轉給 Bear（白天最慢約 1 小時），不重跑、不修 code。
# 手動執行時勾 test 會故意轉紅，用來確認這條通道。
on:
  schedule:
    - cron: "0 6 * * 0"   # 週日 06:00 UTC = 台北 14:00
    - cron: "0 1 * * *"   # 每天 01:00 UTC = 台北 09:00，檢查卡住的 PR
  workflow_dispatch:
    inputs:
      test:
        description: "故意轉紅，測試 Grok Bot 通道"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BLOG: agoodbear/agoodbear.github.io
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Check this week and notify
        run: |
          failed=0
          # 不推 LINE：寫 ::error::（Grok Bot 讀 annotation 轉給 Bear）＋step summary，整支結束時轉紅
          alert() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            esc=$(printf '%s' "$1" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error::${esc}"
            failed=1
          }
          if [ "${{ inputs.test }}" = "true" ]; then
            alert "🔔 ER Cardio Weekly 通知測試（不是真的出事）：週報 PR 卡住或雲端沒產出時，會經 Grok Bot 通知。測試網址：https://github.com/agoodbear/agoodbear.github.io/pulls"
            exit 1
          fi
          # ② 每天：開超過 24 小時還沒合併的週報 PR
          stale=$(gh pr list -R "$BLOG" --state open --json headRefName,url,createdAt \
            -q '.[] | select(.headRefName|startswith("claude/ercw-")) | select((now - (.createdAt|fromdateiso8601)) > 86400) | .url')
          if [ -n "$stale" ]; then
            alert "⏳ ER Cardio Weekly 有週報 PR 卡超過 24 小時沒上線（查核沒過，等你決定）：
          ${stale}
          👉 跟 Claude Code 說「看週報 PR」"
          fi
          [ "$SCHEDULE" = "0 1 * * *" ] && exit "$failed"

          # ① 週日 14:00：本週有沒有產出
          week=$(TZ=Asia/Taipei python3 -c "from datetime import date;d=date.today();print(f'{d.isocalendar()[0]}-W{d.isocalendar()[1]:02d}')")
          if gh api "repos/$BLOG/contents/content/er-cardio-weekly/$week/index.md?ref=hugo-source" >/dev/null 2>&1; then
            echo "$week 已在 hugo-source"; exit "$failed"
          fi
          pr=$(gh pr list -R "$BLOG" --head "claude/ercw-$week" --state open --json url -q '.[0].url' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            echo "$week 有開著的 PR（查核未過，由 auto-PR 轉紅）：$pr"; exit "$failed"
          fi
          alert "⚠️ ER Cardio Weekly ${week} 到台北 14:00 還沒產出（雲端排程可能沒跑或中途失敗）。
          看執行紀錄：https://claude.ai/code/routines
          👉 跟 Claude Code 說「修週報」，或在 Grok Bot 說「cc 修 週報」（要 Mac 開著）"
          exit "$failed"
